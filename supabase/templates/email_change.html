<h2>Confirm your new email address</h2>

<p>Follow the link below to confirm {{ .NewEmail }} as your account's email address. Any links you've already created stay exactly as they are.</p>

<p><a href="{{ .RedirectTo }}/api/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/dashboard">Confirm new email address</a></p>

<p>If you didn't request this, you can safely ignore this email.</p>
