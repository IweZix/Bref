name: Keep Supabase Alive
run-name: Keep-alive ping for ${{ github.event.repository.name }}

on:
  schedule:
    # Every 3 days — the Supabase free tier auto-pauses after 7 days of no
    # activity, and a pg_cron job running inside the DB doesn't reliably count.
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping health check endpoint
        # Update this URL if a custom domain is attached to the Vercel project.
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://bref-six.vercel.app/api/health)
          echo "Health check responded with $response"
          if [ "$response" != "200" ]; then
            echo "Health check failed"
            exit 1
          fi
